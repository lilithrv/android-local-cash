plugins {
    alias(libs.plugins.android.application)
}

// Lee la API key de Google Maps desde local.properties
def mapsApiKey = ""
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    def localProps = new Properties()
    localPropsFile.withInputStream { localProps.load(it) }
    mapsApiKey = localProps.getProperty("MAPS_API_KEY", "")
}

android {
    namespace 'com.example.localcash'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.localcash"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        // Se inyecta en el <meta-data> del AndroidManifest
        manifestPlaceholders["MAPS_API_KEY"] = mapsApiKey

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.biometric
    implementation libs.play.services.maps
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
